name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build lakew
        run: lake build

      - name: Build the native test harness and benchmark suite
        run: lake build TestSupport suite-bench

      - name: Run test suite (golden, fixtures, diagnostics, stock-lake interop)
        run: bash test/run.sh
